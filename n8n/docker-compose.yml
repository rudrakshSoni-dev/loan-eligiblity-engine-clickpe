services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.4
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      WEBHOOK_URL: http://${N8N_PRIVATE_IP}:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_SECURE_COOKIE: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_AWS_SYSTEM_CREDENTIALS_ACCESS_ENABLED: "true"
      NODE_EXTRA_CA_CERTS: /certs/rds-global-bundle.pem
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - n8n_data:/home/node/.n8n
      - /opt/clickpe/global-bundle.pem:/certs/rds-global-bundle.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
